# License gate for the xlsx sidecar (issue #98): every dependency must offer
# at least one license from this allowlist (cargo-deny picks the most
# favorable branch of OR expressions). Run: cargo deny check licenses
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
]
